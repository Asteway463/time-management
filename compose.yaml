services:
  dev:
    build:
      context: .
      target: dev
    init: true
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

  web:
    build:
      context: .
      target: web
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped

volumes:
  node_modules:
